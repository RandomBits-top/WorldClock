<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" id="metaThemeColor" />
  <title>World Time</title>
  <style>
    /* Zero-dependency CSS variables for crisp Dark & Light themes */
    :root {
      --bg: #0f1115;
      --surface: #161920;
      --surface-hover: #1e222b;
      --border: #262b36;
      --text: #f3f4f6;
      --text-muted: #8b949e;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);

      /* Timeline hour block colors */
      --hr-night-bg: #13161c;
      --hr-night-fg: #5c667a;
      --hr-shoulder-bg: #1b2434;
      --hr-shoulder-fg: #93c5fd;
      --hr-work-bg: #1e293b;
      --hr-work-fg: #f8fafc;
      --hr-work-border: #334155;

      --now-line: #ef4444;
      --sel-ring: #60a5fa;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);

      --hr-night-bg: #f1f5f9;
      --hr-night-fg: #94a3b8;
      --hr-shoulder-bg: #eff6ff;
      --hr-shoulder-fg: #2563eb;
      --hr-work-bg: #ffffff;
      --hr-work-fg: #0f172a;
      --hr-work-border: #cbd5e1;

      --now-line: #dc2626;
      --sel-ring: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .widget {
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    /* Ultra-compact utility bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .date-pill {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }

    .inspect-badge {
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 500;
      white-space: nowrap;
      display: none;
    }

    .inspect-badge.active {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: var(--font-sans);
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-install {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-install:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-install.hidden {
      display: none;
    }

    /* Compact Install Instruction Popover */
    .install-popover {
      position: fixed;
      top: 40px;
      right: 10px;
      width: min(290px, calc(100vw - 20px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      z-index: 100;
      font-size: 11.5px;
      color: var(--text);
      display: none;
    }

    .install-popover.open {
      display: block;
    }

    .install-popover-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .install-popover p {
      color: var(--text-muted);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .install-popover p:last-child {
      margin-bottom: 0;
    }

    .install-popover code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
      font-family: var(--font-sans);
      font-size: 10.5px;
      color: var(--text);
    }

    /* Scrollable container for narrow embeds */
    .grid-wrap {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .city-row {
      display: grid;
      grid-template-columns: 185px minmax(528px, 1fr);
      align-items: center;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s ease;
    }

    .city-row:last-child {
      border-bottom: none;
    }

    .city-row:hover {
      background: var(--surface-hover);
    }

    .city-row.is-home {
      background: var(--accent-soft);
    }

    /* Left City Info Column */
    .city-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-right: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      gap: 6px;
      position: sticky;
      left: 0;
      background: inherit;
      z-index: 2;
    }

    /* Ensure sticky cell has opaque backdrop */
    .city-meta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--surface);
      z-index: -2;
    }
    .city-row.is-home .city-meta::before {
      background: var(--surface);
    }
    .city-row.is-home .city-meta::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-soft);
      z-index: -1;
    }

    .city-left {
      min-width: 0;
    }

    .city-name-line {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .home-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .city-name {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .city-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
    }

    .city-right {
      text-align: right;
      flex-shrink: 0;
    }

    .city-time {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: -0.3px;
    }

    .city-date {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* 24-Hour Horizontal Timeline */
    .hours-strip {
      display: grid;
      grid-template-columns: repeat(24, minmax(22px, 1fr));
      height: 100%;
      min-height: 40px;
      position: relative;
      padding: 3px 4px;
      gap: 2px;
    }

    .hr-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .hr-cell.night {
      background: var(--hr-night-bg);
      color: var(--hr-night-fg);
    }

    .hr-cell.shoulder {
      background: var(--hr-shoulder-bg);
      color: var(--hr-shoulder-fg);
    }

    .hr-cell.work {
      background: var(--hr-work-bg);
      color: var(--hr-work-fg);
      border: 1px solid var(--hr-work-border);
    }

    .hr-cell.day-start {
      border-left: 2px solid var(--accent);
    }

    .hr-cell .ampm {
      font-size: 8px;
      font-weight: 500;
      opacity: 0.75;
      line-height: 1;
      margin-top: 1px;
      font-family: var(--font-sans);
    }

    /* Current hour marker */
    .hr-cell.is-now::after {
      content: "";
      position: absolute;
      top: -2px;
      bottom: -2px;
      left: 50%;
      width: 2px;
      background: var(--now-line);
      transform: translateX(-50%);
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.85;
    }

    /* Hover / Selected column highlight */
    .hr-cell.col-hover {
      box-shadow: inset 0 0 0 1.5px var(--text-muted);
      z-index: 1;
    }

    .hr-cell.col-selected {
      box-shadow: inset 0 0 0 2px var(--sel-ring);
      background: var(--accent-soft) !important;
      color: var(--text) !important;
      z-index: 2;
    }

    @media (max-width: 640px) {
      .city-row {
        grid-template-columns: 148px minmax(504px, 1fr);
      }
      .city-meta {
        padding: 5px 8px;
      }
      .city-name {
        font-size: 11.5px;
      }
      .city-time {
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="topbar">
      <div class="status-group">
        <span class="date-pill" id="refDateLabel">Loading...</span>
        <span class="inspect-badge" id="inspectBadge">
          <span id="inspectText"></span>
          <span style="cursor:pointer;font-weight:700" id="clearInspect" title="Reset to live time">×</span>
        </span>
      </div>
      <div class="controls">
        <button class="btn btn-install" id="installBtn" title="Install as a standalone Windows app">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v8m0 0l-3-3m3 3l3-3M3 13h10"/>
          </svg>
          <span>Install App</span>
        </button>
        <button class="btn" id="nowBtn" title="Jump to current live time">Now</button>
        <button class="btn active" id="fmtBtn" title="Toggle 12h / 24h format">12h</button>
        <button class="btn" id="themeBtn" title="Toggle Dark / Light theme">☀︎</button>
      </div>
    </div>
    <div class="install-popover" id="installPopover" role="dialog" aria-label="Install instructions">
      <div class="install-popover-head">
        <span>Install on Windows</span>
        <span style="cursor:pointer;font-size:14px;line-height:1;color:var(--text-muted)" id="closePopover" title="Close">×</span>
      </div>
      <p><strong>Edge:</strong> Click <code>⋯</code> (top-right) → <code>Apps</code> → <code>Install this site as an app</code>.</p>
      <p><strong>Chrome:</strong> Click <code>⋮</code> (top-right) → <code>Cast, save, and share</code> → <code>Install page as app</code>.</p>
      <p id="iframeHint" style="display:none;color:var(--accent);font-weight:500;">Tip: Open this widget URL directly in its own browser tab first if embedded.</p>
    </div>
    <div class="grid-wrap" id="gridWrap"></div>
  </div>

  <script>
    (() => {
      // --- PWA Manifest & Service Worker Setup (Zero External Files) ---
      function setupPWA() {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f1115"/><circle cx="256" cy="256" r="168" fill="none" stroke="#3b82f6" stroke-width="28"/><path d="M256 144v112l76 44" fill="none" stroke="#f3f4f6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);

        // Set favicon dynamically
        const favicon = document.createElement("link");
        favicon.rel = "icon";
        favicon.href = iconUrl;
        document.head.appendChild(favicon);

        // Build standalone Web App Manifest dynamically
        const manifest = {
          name: "World Time",
          short_name: "World Time",
          description: "Lightweight multi-timezone world clock & planner",
          start_url: window.location.href,
          scope: window.location.origin + window.location.pathname,
          display: "standalone",
          background_color: "#0f1115",
          theme_color: "#0f1115",
          icons: [
            { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
            { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // Register minimal Service Worker (required by Chromium for installability)
        if ("serviceWorker" in navigator && window.isSecureContext) {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
              e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
            });
          `;
          try {
            const swBlob = new Blob([swCode], { type: "application/javascript" });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(() => {
              // Graceful fallback if Blob SW is restricted by browser policy
            });
          } catch (_) {}
        }
      }
      setupPWA();

      // Exact 8 cities from the World Time Buddy URL in order
      const CITIES = [
        { id: "5368361", name: "Los Angeles", tz: "America/Los_Angeles" },
        { id: "6173331", name: "Vancouver",   tz: "America/Vancouver" },
        { id: "5913490", name: "Calgary",     tz: "America/Edmonton" },
        { id: "6167865", name: "Toronto",     tz: "America/Toronto" },
        { id: "7114227", name: "Santiago",    tz: "America/Santiago" },
        { id: "2643743", name: "London",      tz: "Europe/London" },
        { id: "993800",  name: "Johannesburg",tz: "Africa/Johannesburg" },
        { id: "2147714", name: "Sydney",      tz: "Australia/Sydney" }
      ];

      // Allow optional URL query overrides (?h=6173331&hf=0&theme=light)
      const params = new URLSearchParams(window.location.search);
      let homeId = params.get("h") || "6173331"; // Default: Vancouver
      let use24h = params.get("hf") === "1";     // Default: 12h (hf=0)
      let theme = params.get("theme") || "dark";

      let hoveredCol = null;
      let selectedCol = null; // 0..23 index relative to home city's current day
      let baseSlots = [];     // Array of 24 Date objects (each representing an exact UTC instant)

      const gridWrap = document.getElementById("gridWrap");
      const refDateLabel = document.getElementById("refDateLabel");
      const inspectBadge = document.getElementById("inspectBadge");
      const inspectText = document.getElementById("inspectText");
      const clearInspect = document.getElementById("clearInspect");
      const fmtBtn = document.getElementById("fmtBtn");
      const themeBtn = document.getElementById("themeBtn");
      const nowBtn = document.getElementById("nowBtn");
      const installBtn = document.getElementById("installBtn");
      const installPopover = document.getElementById("installPopover");
      const closePopover = document.getElementById("closePopover");
      const iframeHint = document.getElementById("iframeHint");
      const metaThemeColor = document.getElementById("metaThemeColor");

      // Hide Install button if already running as an installed standalone Windows app
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      if (isStandalone) {
        installBtn.classList.add("hidden");
      }

      if (window.self !== window.top) {
        iframeHint.style.display = "block";
      }

      // Capture native Windows Edge / Chrome install prompt
      let deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        installBtn.classList.remove("hidden");
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installBtn.classList.add("hidden");
        installPopover.classList.remove("open");
      });

      installBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === "accepted") {
            installBtn.classList.add("hidden");
          }
          deferredInstallPrompt = null;
        } else {
          installPopover.classList.toggle("open");
        }
      });

      closePopover.addEventListener("click", () => {
        installPopover.classList.remove("open");
      });

      document.addEventListener("click", (e) => {
        if (!installPopover.contains(e.target) && e.target !== installBtn) {
          installPopover.classList.remove("open");
        }
      });

      // Apply initial theme & format UI
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        themeBtn.textContent = t === "dark" ? "☀︎" : "☾";
        if (metaThemeColor) {
          metaThemeColor.setAttribute("content", t === "dark" ? "#0f1115" : "#ffffff");
        }
      }
      applyTheme(theme);
      fmtBtn.textContent = use24h ? "24h" : "12h";
      fmtBtn.classList.toggle("active", !use24h);

      // Extract timezone parts cleanly using native Intl.DateTimeFormat
      function getTzParts(date, timeZone) {
        const dtf = new Intl.DateTimeFormat("en-US", {
          timeZone,
          year: "numeric",
          month: "short",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZoneName: "short"
        });
        const parts = {};
        for (const p of dtf.formatToParts(date)) {
          parts[p.type] = p.value;
        }
        // Normalize "24" hour edge case in some locales to 0
        let hour = parseInt(parts.hour, 10);
        if (hour === 24) hour = 0;
        return {
          year: parts.year,
          month: parts.month,
          day: parts.day,
          weekday: parts.weekday,
          hour,
          minute: parts.minute,
          tzName: parts.timeZoneName || ""
        };
      }

      // Calculate UTC offset string (e.g., UTC-8, UTC+11, UTC+5:30)
      function getUtcOffsetLabel(date, timeZone) {
        const utcDate = new Date(date.toLocaleString("en-US", { timeZone: "UTC" }));
        const tzDate = new Date(date.toLocaleString("en-US", { timeZone }));
        const diffMins = Math.round((tzDate - utcDate) / 60000);
        if (diffMins === 0) return "UTC";
        const sign = diffMins > 0 ? "+" : "-";
        const abs = Math.abs(diffMins);
        const h = Math.floor(abs / 60);
        const m = abs % 60;
        return `UTC${sign}${h}${m ? ":" + String(m).padStart(2, "0") : ""}`;
      }

      function formatTime(hour, minute) {
        if (use24h) {
          return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
        }
        const suffix = hour >= 12 ? "PM" : "AM";
        const h12 = hour % 12 === 0 ? 12 : hour % 12;
        return `${h12}:${String(minute).padStart(2, "0")} ${suffix}`;
      }

      function getHourCategory(h) {
        if (h >= 9 && h <= 17) return "work";
        if ((h >= 7 && h <= 8) || (h >= 18 && h <= 21)) return "shoulder";
        return "night";
      }

      // Build 24 exact hourly instants aligned to 00:00..23:00 of the Home city's current day
      function computeHomeDaySlots(now) {
        const homeCity = CITIES.find(c => c.id === homeId) || CITIES[1];
        const homeNow = getTzParts(now, homeCity.tz);

        // Create a baseline timestamp rounded to the current hour, then shift back by homeNow.hour
        const currentHourFloor = new Date(now);
        currentHourFloor.setMinutes(0, 0, 0);

        const slots = [];
        for (let i = 0; i < 24; i++) {
          const deltaHours = i - homeNow.hour;
          slots.push(new Date(currentHourFloor.getTime() + deltaHours * 3600000));
        }
        return slots;
      }

      function render() {
        const now = new Date();
        baseSlots = computeHomeDaySlots(now);
        const homeCity = CITIES.find(c => c.id === homeId) || CITIES[1];
        const homeNow = getTzParts(now, homeCity.tz);

        // Determine active instant for top readout (either selected column or live now)
        const activeInstant = selectedCol !== null ? baseSlots[selectedCol] : now;
        const activeHomeParts = getTzParts(activeInstant, homeCity.tz);

        refDateLabel.textContent = `${homeCity.name} · ${activeHomeParts.weekday}, ${activeHomeParts.month} ${activeHomeParts.day}`;

        if (selectedCol !== null) {
          inspectBadge.classList.add("active");
          inspectText.textContent = `Selected: ${formatTime(activeHomeParts.hour, 0)} ${activeHomeParts.tzName}`;
        } else {
          inspectBadge.classList.remove("active");
        }

        const fragment = document.createDocumentFragment();

        CITIES.forEach(city => {
          const isHome = city.id === homeId;
          // Show either live current time or the selected column's converted time
          const displayParts = selectedCol !== null
            ? getTzParts(baseSlots[selectedCol], city.tz)
            : getTzParts(now, city.tz);

          const displayMinute = selectedCol !== null ? "00" : displayParts.minute;
          const utcOffset = getUtcOffsetLabel(activeInstant, city.tz);

          const row = document.createElement("div");
          row.className = `city-row${isHome ? " is-home" : ""}`;

          // Left Meta Cell (clicking sets this city as the Home reference)
          const meta = document.createElement("div");
          meta.className = "city-meta";
          meta.title = `Click to set ${city.name} as reference city`;
          meta.innerHTML = `
            <div class="city-left">
              <div class="city-name-line">
                ${isHome ? '<span class="home-dot" title="Reference City"></span>' : ""}
                <span class="city-name">${city.name}</span>
              </div>
              <div class="city-sub">
                <span>${displayParts.tzName}</span>
                <span>·</span>
                <span>${utcOffset}</span>
              </div>
            </div>
            <div class="city-right">
              <div class="city-time">${formatTime(displayParts.hour, displayMinute)}</div>
              <div class="city-date">${displayParts.weekday}, ${displayParts.month} ${displayParts.day}</div>
            </div>
          `;
          meta.addEventListener("click", () => {
            homeId = city.id;
            render();
          });

          // Right 24-Hour Timeline Strip
          const strip = document.createElement("div");
          strip.className = "hours-strip";

          baseSlots.forEach((slotDate, colIdx) => {
            const p = getTzParts(slotDate, city.tz);
            const cell = document.createElement("div");
            const cat = getHourCategory(p.hour);
            const isNowCol = colIdx === homeNow.hour;
            const isDayStart = p.hour === 0;

            cell.className = `hr-cell ${cat}${isNowCol ? " is-now" : ""}${isDayStart ? " day-start" : ""}`;
            if (hoveredCol === colIdx) cell.classList.add("col-hover");
            if (selectedCol === colIdx) cell.classList.add("col-selected");
            cell.dataset.col = colIdx;

            if (use24h) {
              cell.textContent = String(p.hour).padStart(2, "0");
            } else {
              const h12 = p.hour % 12 === 0 ? 12 : p.hour % 12;
              const ampm = p.hour >= 12 ? "p" : "a";
              cell.innerHTML = `<span>${h12}</span><span class="ampm">${ampm}</span>`;
            }

            cell.title = `${city.name}: ${formatTime(p.hour, 0)} (${p.weekday}, ${p.month} ${p.day})`;

            // Hover & Click column synchronization across all 8 rows
            cell.addEventListener("mouseenter", () => highlightColumn(colIdx));
            cell.addEventListener("mouseleave", () => highlightColumn(null));
            cell.addEventListener("click", () => {
              selectedCol = selectedCol === colIdx ? null : colIdx;
              render();
            });

            strip.appendChild(cell);
          });

          row.appendChild(meta);
          row.appendChild(strip);
          fragment.appendChild(row);
        });

        gridWrap.innerHTML = "";
        gridWrap.appendChild(fragment);
      }

      // Lightweight DOM class toggle on hover (avoids full re-render on mousemove)
      function highlightColumn(colIdx) {
        hoveredCol = colIdx;
        const cells = gridWrap.querySelectorAll(".hr-cell");
        cells.forEach(c => {
          const idx = Number(c.dataset.col);
          c.classList.toggle("col-hover", colIdx !== null && idx === colIdx);
        });
      }

      // Controls
      fmtBtn.addEventListener("click", () => {
        use24h = !use24h;
        fmtBtn.textContent = use24h ? "24h" : "12h";
        fmtBtn.classList.toggle("active", !use24h);
        render();
      });

      themeBtn.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        applyTheme(theme);
      });

      nowBtn.addEventListener("click", () => {
        selectedCol = null;
        render();
      });

      clearInspect.addEventListener("click", () => {
        selectedCol = null;
        render();
      });

      // Initial render & sync every 15 seconds for live clock accuracy
      render();
      setInterval(() => {
        if (selectedCol === null) render();
      }, 15000);
    })();
  </script>
</body>
</html>
